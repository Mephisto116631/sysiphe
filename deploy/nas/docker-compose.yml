# Sysiphe sur le NAS, exposé en HTTPS public via Tailscale Funnel.
# URL finale : https://sysiphe.<ton-tailnet>.ts.net (aucun port ouvert sur la Freebox)
#
# Dossier conseillé sur OMV : /srv/compose_data/sysiphe/
#   ├── docker-compose.yml   (ce fichier)
#   ├── .env                 (TS_AUTHKEY=tskey-auth-...)
#   ├── serve.json
#   └── secrets.toml         (SUPABASE_URL, SUPABASE_KEY, APP_URL)

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: sysiphe-tailscale
    hostname: sysiphe
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=sysiphe
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped

  sysiphe:
    image: ghcr.io/mephisto116631/sysiphe:latest
    container_name: sysiphe
    network_mode: service:tailscale   # Streamlit n'est joignable que via Tailscale
    volumes:
      - ./secrets.toml:/app/.streamlit/secrets.toml:ro
    depends_on:
      - tailscale
    restart: unless-stopped
