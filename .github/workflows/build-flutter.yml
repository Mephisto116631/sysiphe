name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/build-flutter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 ─────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Flutter stable ──────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      # ── 4. local.properties (SDK Android + Flutter SDK) ─────────────────────
      - name: Set local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > flutter/android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT"  >> flutter/android/local.properties

      # ── 5. Dépendances Dart ────────────────────────────────────────────────
      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      # ── 6. Version : nom depuis pubspec.yaml, numéro de build = n° du run ──
      #    Le versionCode Android augmente à chaque build : le téléphone
      #    reconnaît toujours le nouvel APK comme une mise à jour.
      - name: Get version
        id: version
        working-directory: flutter
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "name=v$VERSION" >> $GITHUB_OUTPUT
          echo "full=$VERSION+${{ github.run_number }}" >> $GITHUB_OUTPUT

      # ── 7. Build des deux APK release ──────────────────────────────────────
      #    Les clés Supabase sont injectées au moment de la compilation
      #    via --dart-define (jamais dans le code source).
      #    standard → sysiphe.apk ; course (module GPS) → sysiphe-course.apk.
      #    Même versionCode et même signature : on passe de l'une à l'autre.
      - name: Build APK
        working-directory: flutter
        run: |
          for f in standard course; do
            extra=""
            if [ "$f" = course ]; then extra="--dart-define=COURSE=true"; fi
            flutter build apk --release --flavor $f $extra \
              --build-number=${{ github.run_number }} \
              --dart-define=APP_VERSION=${{ steps.version.outputs.full }} \
              --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
              --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          done
        timeout-minutes: 30

      # ── 8. Signature ───────────────────────────────────────────────────────
      - name: Sign APK
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > /tmp/keystore.jks
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name "apksigner" | sort -V | tail -n1)
          for pair in "standard:sysiphe.apk" "course:sysiphe-course.apk"; do
            f=${pair%%:*}; out=${pair#*:}
            "$APKSIGNER" sign \
              --ks /tmp/keystore.jks \
              --ks-key-alias sysiphe \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --out "$out" \
              "flutter/build/app/outputs/flutter-apk/app-$f-release.apk"
          done
          rm /tmp/keystore.jks

      # ── 9. GitHub Release ─────────────────────────────────────────────────
      #    Les versions ≤ 2.17 de l'app installent le PREMIER APK de la
      #    Release, et GitHub les liste par ordre alphabétique :
      #    « sysiphe-course.apk » passe avant « sysiphe.apk ». On publie donc
      #    aussi une copie de la version standard, « sysiphe-basique.apk »,
      #    qui passe en tête. (À retirer quand plus personne n'est en 2.17.)
      #    Les versions ≥ 2.18 cherchent leur APK par son nom exact.
      - name: Copie pour les anciennes versions
        run: cp sysiphe.apk sysiphe-basique.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: "Sysiphe ${{ steps.version.outputs.name }}"
          # Notes générées depuis les PR fusionnées depuis la Release précédente.
          # Un rebuild de la même version met à jour cette Release.
          body: |
            Build ${{ steps.version.outputs.full }} — commit ${{ github.sha }}
          generate_release_notes: true
          files: |
            sysiphe-basique.apk
            sysiphe.apk
          make_latest: true

      # ── 10. APK du module Course ────────────────────────────────────────────
      #    gh release upload : n'ajoute que le fichier (texte de la Release
      #    et numéro de build inchangés).
      - name: Add course APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.version.outputs.name }}" sysiphe-course.apk --clobber
