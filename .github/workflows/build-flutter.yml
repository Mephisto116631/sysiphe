name: Build Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/build-flutter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 ─────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Flutter stable ──────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      # ── 4. local.properties (SDK Android + Flutter SDK) ─────────────────────
      - name: Set local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > flutter/android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT"  >> flutter/android/local.properties

      # ── 5. Dépendances Dart ────────────────────────────────────────────────
      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      # ── 6. Build APK release ───────────────────────────────────────────────
      #    Les clés Supabase sont injectées au moment de la compilation
      #    via --dart-define (jamais dans le code source).
      - name: Build APK
        working-directory: flutter
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        timeout-minutes: 20

      # ── 7. Signature ───────────────────────────────────────────────────────
      - name: Sign APK
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > /tmp/keystore.jks
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name "apksigner" | sort -V | tail -n1)
          "$APKSIGNER" sign \
            --ks /tmp/keystore.jks \
            --ks-key-alias sysiphe \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out sysiphe.apk \
            flutter/build/app/outputs/flutter-apk/app-release.apk
          rm /tmp/keystore.jks

      # ── 8. Version depuis pubspec.yaml ────────────────────────────────────
      - name: Get version
        id: version
        working-directory: flutter
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "name=v$VERSION" >> $GITHUB_OUTPUT

      # ── 9. GitHub Release ─────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: "Sysiphe ${{ steps.version.outputs.name }}"
          body: |
            Build Flutter automatique — commit ${{ github.sha }}

            **Nouveautés v2.0 :**
            - App native Flutter (plus de WebView)
            - Connexion directe à Supabase
            - 5 onglets : Saisie, Stats, Calendrier, Records, Paramètres
          files: sysiphe.apk
          make_latest: true
