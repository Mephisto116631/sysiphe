name: Build APK Sysiphe

on:
  push:
    tags: ["v*"]                      # git tag v1.0.0 && git push origin v1.0.0
    branches: [main]
    paths: ["mobile/package.json"]    # ou : changer "version" dans mobile/package.json
  workflow_dispatch:                  # bouton "Run workflow" pour un build de test

permissions:
  contents: write         # nécessaire pour créer la Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # pour connaître les tags existants

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21    # requis par Capacitor 7

      - name: Vérifier les secrets de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS; do
            [ -n "${!v}" ] || { echo "::error::Secret $v manquant (Settings > Secrets and variables > Actions)"; exit 1; }
          done

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le projet Android
        run: |
          npx cap add android
          mkdir -p assets && cp ../assets/icon.png assets/icon-only.png
          npx capacitor-assets generate --android --iconBackgroundColor '#161616' --splashBackgroundColor '#161616'
          npx cap sync android

      - name: Versionner l'APK
        run: |
          RELEASE=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"; RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION=$(node -p "require('./package.json').version")
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "::notice::Tag v$VERSION déjà existant : build sans Release (pense à incrémenter la version)"
              VERSION="$VERSION-build${{ github.run_number }}"
            else
              RELEASE=true
            fi
          else
            VERSION="0.0.${{ github.run_number }}-dev"
          fi
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"

      - name: Compiler l'APK release
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Signer l'APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --out "Sysiphe-$APK_VERSION.apk" aligned.apk
          "$BT/apksigner" verify "Sysiphe-$APK_VERSION.apk"
          rm release.jks

      - name: Publier en Release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APK_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Sysiphe ${{ env.APK_VERSION }}
          files: mobile/Sysiphe-*.apk
          generate_release_notes: true

      - name: Artefact (build sans Release)
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sysiphe-apk
          path: mobile/Sysiphe-*.apk
