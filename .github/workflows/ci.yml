name: CI

# Vérifie chaque PR (et chaque push sur main) AVANT publication :
# analyse + tests Flutter, tests Python. Ne construit ni ne publie d'APK.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter — analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'   # même version que build-flutter.yml
          channel: 'stable'
          cache: true

      - run: flutter pub get
      # Échoue sur les erreurs et avertissements, pas sur les remarques de style.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  apk:
    name: Flutter — build APK (vérification Android)
    # Compile vraiment l'APK : seul moyen de valider le code natif (Kotlin,
    # manifeste, Gradle) avant fusion. Debug, non signé, non publié.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT"  >> android/local.properties

      - run: flutter pub get
      - run: flutter build apk --debug --dart-define=APP_VERSION=0.0.0+0
        timeout-minutes: 20

  version:
    name: Version de l'app augmentée
    # Toute PR qui change l'app (flutter/lib, android, pubspec) doit changer
    # « version: » dans pubspec.yaml : sinon l'APK écrase la Release précédente
    # (même tag, notes fausses, impossible de revenir en arrière).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vérifier pubspec.yaml
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          app=$(git diff --name-only "$BASE"...HEAD -- flutter/lib flutter/android flutter/pubspec.yaml)
          if [ -z "$app" ]; then echo "L'app n'est pas modifiée : rien à vérifier."; exit 0; fi
          avant=$(git show "$BASE:flutter/pubspec.yaml" | grep '^version:' | awk '{print $2}' | cut -d+ -f1)
          apres=$(grep '^version:' flutter/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "Version : $avant → $apres"
          if [ "$avant" = "$apres" ]; then
            echo "::error file=flutter/pubspec.yaml::L'app change mais la version reste $avant : augmente « version: » (ex. 2.7.1+1)."
            exit 1
          fi
          plus_grande=$(printf '%s\n%s\n' "$avant" "$apres" | sort -V | tail -n 1)
          if [ "$plus_grande" != "$apres" ]; then
            echo "::error file=flutter/pubspec.yaml::La version $apres est inférieure à $avant."
            exit 1
          fi

  python:
    name: Python — tests data.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas numpy pytest
      - run: pytest test_data.py -v
