<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sysiphe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh;
    background: #f5f5f5;
    font-family: -apple-system, Roboto, sans-serif;
    color: #333;
    padding: 2rem;
  }
  .icon { font-size: 72px; margin-bottom: 1.5rem; }
  h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: .5rem; color: #1565C0; }
  p  { font-size: 1rem; color: #666; text-align: center; line-height: 1.5; margin-bottom: 2rem; }
  button {
    background: #1565C0; color: #fff;
    border: none; border-radius: 12px;
    padding: .9rem 2.5rem; font-size: 1rem; font-weight: 600;
    cursor: pointer;
  }
  button:active { background: #0D47A1; }
</style>
</head>
<body>
  <div class="icon">🏋️</div>
  <h1>Sysiphe</h1>
  <p>L'application est momentanément inaccessible.<br>Vérifiez votre connexion et réessayez.</p>
  <button onclick="location.reload()">Réessayer</button>
</body>
</html>
