# Sysiphe sur le NAS, exposé en HTTPS public via Tailscale Funnel.
# URL finale : https://sysiphe.<ton-tailnet>.ts.net (aucun port ouvert sur la Freebox)
#
# Installation via le plugin Compose d'OMV (fichier « sysiphe ») :
# /compose_data/sysiphe/
#   ├── sysiphe.yml          (ce fichier, créé par OMV)
#   ├── .env                 (TS_AUTHKEY=tskey-auth-..., onglet « Environnement » d'OMV)
#   ├── serve.json
#   └── secrets.toml         (SUPABASE_URL, SUPABASE_KEY, APP_URL)
# /compose_data est déjà archivé chaque nuit par backup-nas.sh.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: sysiphe-tailscale
    hostname: sysiphe
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=sysiphe
      - TS_EXTRA_ARGS=--advertise-tags=tag:nas
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    logging: *logging
    restart: unless-stopped

  sysiphe:
    image: ghcr.io/mephisto116631/sysiphe:latest
    container_name: sysiphe
    network_mode: service:tailscale   # Streamlit n'est joignable que via Tailscale
    volumes:
      - ./secrets.toml:/app/.streamlit/secrets.toml:ro
    depends_on:
      - tailscale
    logging: *logging
    restart: unless-stopped
