<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sysiphe</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         gap:14px; background:#161616; color:#e8e8e8; font-family:system-ui,-apple-system,sans-serif; text-align:center; padding:0 24px; }
  .spin { width:34px; height:34px; border:3px solid #333; border-top-color:#e8e8e8; border-radius:50%; animation:r .8s linear infinite; }
  @keyframes r { to { transform:rotate(360deg); } }
  #msg { font-size:15px; color:#aaa; }
  button { display:none; padding:12px 22px; border:0; border-radius:10px; background:#e8e8e8; color:#161616; font-size:15px; }
</style>
</head>
<body>
  <div class="spin" id="spin"></div>
  <div id="msg">Connexion à Sysiphe…</div>
  <button id="retry" onclick="start()">Réessayer</button>
<script>
// Ordre d'essai : NAS (rapide, auto-hébergé) puis Streamlit Cloud (secours).
// Les URLs viennent de mobile/targets.json sur GitHub : changer d'URL = un commit, pas de rebuild.
const CONFIG_URL = "https://raw.githubusercontent.com/Mephisto116631/sysiphe/main/mobile/targets.json";
const DEFAULTS = { nas: "", cloud: "https://sysiphe-voseesdgwwcstfepbdepkh.streamlit.app" };
const $ = (id) => document.getElementById(id);

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
}

function cached() {
  try { return JSON.parse(localStorage.getItem("sysiphe_targets")) || null; } catch (e) { return null; }
}

async function loadTargets() {
  const local = cached();
  try {
    const res = await withTimeout(fetch(CONFIG_URL, { cache: "no-store" }), local ? 1500 : 3000);
    const remote = await res.json();
    try { localStorage.setItem("sysiphe_targets", JSON.stringify(remote)); } catch (e) {}
    return remote;
  } catch (e) {
    return local || DEFAULTS;
  }
}

async function reachable(url, ms) {
  try {
    // no-cors : réponse opaque, mais la promesse ne résout que si le serveur répond.
    await withTimeout(fetch(url.replace(/\/$/, "") + "/_stcore/health", { mode: "no-cors", cache: "no-store" }), ms);
    return true;
  } catch (e) {
    return false;
  }
}

async function start() {
  $("retry").style.display = "none";
  $("spin").style.display = "block";
  $("msg").textContent = "Connexion à Sysiphe…";

  const t = await loadTargets();

  // NAS (réseau local, sans auth Streamlit) : WebView directe OK
  if (t.nas && await reachable(t.nas, 2500)) return location.replace(t.nas);

  const cloud = t.cloud || DEFAULTS.cloud;
  if (!cloud) {
    $("spin").style.display = "none";
    $("msg").textContent = "Aucune URL configurée. Vérifie mobile/targets.json.";
    $("retry").style.display = "block";
    return;
  }

  // Cloud Streamlit : ouvre dans Chrome Custom Tabs si on est dans l'APK.
  // Chrome partage ses cookies avec CCT → la session Streamlit passe le gate.
  // (La WebView a un cookie jar isolé et ne connaît pas la session Streamlit.)
  if (window.AndroidBridge) {
    window.AndroidBridge.openInBrowser(cloud);
    return;
  }

  // Navigateur web (dev / desktop) : navigation directe
  location.replace(cloud);
}

start();
</script>
</body>
</html>
