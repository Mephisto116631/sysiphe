name: Image Docker Sysiphe

# À chaque commit sur main, publie ghcr.io/mephisto116631/sysiphe:latest.
# Le NAS récupère la nouvelle image automatiquement (deploy/nas/update.sh).
on:
  push:
    branches: [main]
    paths-ignore:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
      - "deploy/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mephisto116631/sysiphe:latest
            ghcr.io/mephisto116631/sysiphe:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
