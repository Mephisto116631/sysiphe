name: sysiphe
description: Sysiphe — fitness tracker natif Flutter
version: 2.5.1+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0
  crypto: ^3.0.3          # repli de transition : PIN vérifié localement

  # Charts
  fl_chart: ^0.68.0

  # Calendrier heatmap
  table_calendar: ^3.1.0

  # Préférences locales légères
  shared_preferences: ^2.3.2

  # Utilitaires
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# app_links 6.4.0+ utilise flutter.compileSdkVersion dans build.gradle de librairie
# ce qui n'est pas disponible pour les plugins → forcer la version 6.3.x
dependency_overrides:
  app_links: ">=6.0.0 <6.4.0"

flutter:
  uses-material-design: true
  assets:
    - assets/
