name: sysiphe
description: Sysiphe — suivi d'entraînement natif Flutter
version: 2.23.1+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  share_plus: ^10.1.4
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0
  crypto: ^3.0.3          # repli de transition : PIN vérifié localement

  # Charts
  fl_chart: ^0.68.0

  # Calendrier heatmap
  table_calendar: ^3.1.0

  # Préférences locales légères
  shared_preferences: ^2.3.2

  # Minuteur d'intervalles : notifications d'arrière-plan, écran allumé
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  wakelock_plus: 1.2.8   # versions ≥ 1.3 exigent un Flutter plus récent

  # Utilitaires
  intl: ^0.19.0
  audioplayers: 6.1.0     # bips du chrono (versions récentes : Flutter plus récent)
  flutter_tts: 4.0.2      # annonces vocales du chrono
  path_provider: ^2.1.5

  # Photo de profil (galerie / appareil photo, réduite par Android)
  image_picker: 1.1.2     # versions récentes : Flutter plus récent

  # Module Course (version sysiphe-course.apk) : GPS et carte OpenStreetMap
  geolocator: 13.0.4      # versions récentes : Flutter plus récent
  flutter_map: 7.0.2      # 8.x exige Flutter 3.27
  latlong2: 0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# app_links 6.4.0+ utilise flutter.compileSdkVersion dans build.gradle de librairie
# ce qui n'est pas disponible pour les plugins → forcer la version 6.3.x
dependency_overrides:
  app_links: ">=6.0.0 <6.4.0"
  # Même problème pour geolocator_android 4.6.2 : 4.6.1 fixe compileSdk 34.
  geolocator_android: 4.6.1
  # Dernière version compatible Flutter 3.24 (compileSdk 34 fixe).
  image_picker_android: 0.8.12+21

flutter:
  uses-material-design: true
  assets:
    - assets/
