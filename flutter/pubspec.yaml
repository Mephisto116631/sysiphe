name: sysiphe
description: Sysiphe — fitness tracker natif Flutter
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0
  crypto: ^3.0.3          # SHA-256 pour vérification PIN

  # Charts
  fl_chart: ^0.68.0

  # Calendrier heatmap
  table_calendar: ^3.1.0

  # Préférences locales légères
  shared_preferences: ^2.3.2

  # Utilitaires
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
